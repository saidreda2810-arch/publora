# Local dev dependencies — WP3. Requires Docker.
# Usage: docker compose up -d   →  DATABASE_URL=postgres://publora:publora@localhost:5432/publora
services:
  postgres:
    image: postgres:16-alpine
    container_name: publora-postgres
    environment:
      POSTGRES_USER: publora
      POSTGRES_PASSWORD: publora
      POSTGRES_DB: publora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publora -d publora"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: publora-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: publora
      MINIO_ROOT_PASSWORD: publora-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles: ["storage"]   # optional: docker compose --profile storage up -d

volumes:
  pgdata:
  miniodata:
